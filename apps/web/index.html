<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Footprint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <h1>Footprint</h1>
      <p>Extra information about the street for blind and low-vision pedestrians.</p>
      <p class="warning">
        Footprint can miss obstacles and never tells you when it is safe to cross. Keep using your cane or guide dog.
      </p>

      <fieldset>
        <legend>Camera source</legend>
        <label><input type="radio" name="source" value="camera" checked /> Phone camera</label>
        <label><input type="radio" name="source" value="clip" /> Recorded clip (development)</label>
        <input id="clip-file" type="file" accept="video/*" aria-label="Choose a recorded street clip" hidden />
      </fieldset>

      <fieldset id="preset">
        <legend>How much should Footprint say?</legend>
        <label><input type="radio" name="preset" value="essential" /> Essential — only urgent and close warnings</label>
        <label><input type="radio" name="preset" value="standard" /> Standard — close and ahead warnings</label>
        <label><input type="radio" name="preset" value="detailed" /> Detailed — everything, including surface and map notes</label>
      </fieldset>

      <button id="start" type="button">Start walking</button>
      <div id="ask-controls" hidden>
        <button id="ask" type="button" aria-pressed="false">Ask a question</button>
        <div class="ask-row">
          <button id="describe" type="button">What's around me</button>
          <button id="repeat" type="button">Repeat</button>
        </div>
      </div>
      <p><a href="/map">See the community hazard map</a></p>

      <!-- Every spoken message is mirrored here so screen readers and sighted helpers can follow along. -->
      <div id="status" role="status" aria-live="polite">Not started.</div>

      <p id="frame-info" class="dev" aria-hidden="true"></p>
      <p id="blur-info" class="dev" aria-hidden="true"></p>
      <!-- The picture on screen is the blurred upload frame (#blur-view). The raw <video> is kept invisible: it only
           feeds the detector and the blur, so faces are never shown, recorded or shared from the screen (ST-10). -->
      <div class="stage" aria-hidden="true">
        <canvas id="blur-view" hidden></canvas>
        <video id="preview" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
