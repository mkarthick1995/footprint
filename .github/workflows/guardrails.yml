name: guardrails

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

# A newer push or PR edit cancels older runs for the same PR, so stale failures don't linger.
concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo secret / private-file scan
        run: node tools/guard/cli.mjs scan --all
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only if the repo is owned by a GitHub *organization*:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docs-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Code changes must update docs/STATUS.md
        run: node tools/guard/cli.mjs docs --base origin/${{ github.base_ref }}

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Roadmap alignment & deviation disclosure
        # PR text goes through env vars (never inline ${{ }} in run:) to avoid script injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: node tools/guard/cli.mjs pr-guard origin/${{ github.base_ref }}
