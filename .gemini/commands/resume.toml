description = "Resume work from repo docs (STATUS + your handoff) without old transcripts"
prompt = """
Resume this project for me.
1. Run `npm run status`, then read docs/STATUS.md and my handoff docs/handoffs/<handle>.md (handle: `git config aicup.handle`). Nothing else yet.
2. Report in <= 10 lines: phase, days left, my claimed steps, other claims (git fetch, open PRs), blockers.
3. Recommend the single highest-scoring next roadmap item for me and the judging criterion it serves. If my handoff's "Next" is not the best use of time, say so.
4. Wait for my go-ahead before writing code.
"""
