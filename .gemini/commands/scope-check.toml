description = "Check an idea/request against the roadmap, safety case, and judging rubric before starting it"
prompt = """
Scope-check this before any work: {{args}}

Read docs/ROADMAP.md and docs/SAFETY.md (sections 2-4 and 7), and docs/DECISIONS.md only if an ADR may be affected. Answer:
1. Roadmap: item it maps to, or DEVIATION.
2. Multi-angle review (SAFETY.md section 7), one or two blunt lines each: physical safety; failure modes (wrong / late / silent / offline / unknown case -> ladder level); privacy (user, bystanders, location, audio); security & abuse; accessibility; claims & ethics; limitations.
3. Risk IDs affected, or new ones to add (proposed ID + severity + mitigation + test).
4. Score impact per criterion (Tech 40 / Impact 25 / Innovation 25 / UX 10) and time cost vs days left to 10-17.
5. Recommendation: do now / defer / drop. If a Critical/High risk can't be mitigated or disclosed in time, say drop. Do not just agree with me.
"""
