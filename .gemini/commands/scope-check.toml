description = "Check an idea/request against the roadmap and judging rubric before starting it"
prompt = """
Scope-check this before any work: {{args}}

Read docs/ROADMAP.md (and docs/DECISIONS.md only if an ADR may be affected). Then answer:
- Roadmap item it maps to, or "DEVIATION".
- Score impact per criterion (Tech 40 / Impact 25 / Innovation 25 / UX 10), bluntly.
- Time cost vs days left to 10-17; what it would push out (see "Cut order").
- Recommendation: do now / defer to stretch / drop, with reasons. Do not just agree with me.
"""
