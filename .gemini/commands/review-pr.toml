description = "(Code owner) Thorough PR review: roadmap alignment and deviations first, then quality"
prompt = """
Review PR {{args}} for the code owner. Be thorough and blunt; the owner decides.

Get the change: with gh -> `gh pr view {{args}} --json title,body,headRefName,commits,files` and `gh pr diff {{args}}`; otherwise `git fetch origin`, `git diff origin/main...origin/<branch>`, `git log origin/main..origin/<branch>`. Read only the claimed roadmap items and the ARCHITECTURE/DECISIONS sections touched.

Report in this order:
1. ROADMAP DEVIATIONS (top): declared (is Why convincing? ADR exists? DEVIATION(ADR-0xx) comments at each site?) and undeclared (out-of-scope changes with no disclosure, file:line, must-fix). For each: score impact (Tech 40 / Impact 25 / Innovation 25 / UX 10), time cost, recommendation.
2. Hard requirements (AGENTS.md section 2).
3. Security & privacy.
4. Correctness & product safety (fail-loud, latency, error handling).
5. Docs sync (STATUS / ARCHITECTURE / DECISIONS / README / .env.example).
6. Code quality.
7. Verdict: APPROVE / REQUEST CHANGES / BLOCK with numbered must-fix list.

Do not approve, merge, or post on GitHub unless the owner explicitly asks; if asked, comment only (`gh pr review {{args}} --comment`).
"""
